name: Update Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Activity Graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets

          cat > /tmp/generate_graph.py <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from xml.sax.saxutils import escape

          username = "ElmoGaber"

          # ---------------------------------------------------------
          # Date range
          # ---------------------------------------------------------

          end = datetime.now(timezone.utc).date()
          start = end - timedelta(days=364)

          # ---------------------------------------------------------
          # GitHub GraphQL
          # ---------------------------------------------------------

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          variables = {
              "login": username,
              "from": f"{start}T00:00:00Z",
              "to": f"{end}T23:59:59Z"
          }

          payload = json.dumps({
              "query": query,
              "variables": variables
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-activity-graph"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if "errors" in result:
              raise RuntimeError(json.dumps(result["errors"]))

          calendar = (
              result["data"]
              ["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          weeks = calendar["weeks"]

          days = [
              day
              for week in weeks
              for day in week["contributionDays"]
          ]

          counts = {
              day["date"]: day["contributionCount"]
              for day in days
          }

          # ---------------------------------------------------------
          # Build complete date range
          # ---------------------------------------------------------

          dates = []
          current = start

          while current <= end:
              dates.append(current)
              current += timedelta(days=1)

          values = [
              counts.get(str(date), 0)
              for date in dates
          ]

          total = sum(values)
          active_days = sum(value > 0 for value in values)

          peak = max(values) if values else 0

          peak_index = (
              values.index(peak)
              if peak > 0
              else 0
          )

          peak_date = (
              dates[peak_index]
              if values
              else end
          )

          # ---------------------------------------------------------
          # SVG dimensions
          # ---------------------------------------------------------

          width = 1200
          height = 430

          left = 72
          right = 32
          top = 108
          bottom = 62

          chart_width = width - left - right
          chart_height = height - top - bottom

          max_value = max(values) if values else 1

          if max_value == 0:
              max_value = 1

          # ---------------------------------------------------------
          # Coordinate helpers
          # ---------------------------------------------------------

          def x(index):
              if len(values) <= 1:
                  return left

              return (
                  left
                  + (index / (len(values) - 1))
                  * chart_width
              )

          def y(value):
              return (
                  top
                  + chart_height
                  - (value / max_value)
                  * chart_height
              )

          # ---------------------------------------------------------
          # SVG
          # ---------------------------------------------------------

          svg = []

          svg.append(
              '<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="100%" height="{height}" '
              f'viewBox="0 0 {width} {height}" '
              'preserveAspectRatio="xMidYMid meet">'
          )

          # ---------------------------------------------------------
          # Definitions
          # ---------------------------------------------------------

          svg.append("""
          <defs>

            <linearGradient
              id="areaGradient"
              x1="0"
              y1="0"
              x2="0"
              y2="1"
            >
              <stop
                offset="0%"
                stop-color="#58a6ff"
                stop-opacity="0.42"
              />
              <stop
                offset="70%"
                stop-color="#58a6ff"
                stop-opacity="0.12"
              />
              <stop
                offset="100%"
                stop-color="#58a6ff"
                stop-opacity="0"
              />
            </linearGradient>

            <linearGradient
              id="lineGradient"
              x1="0"
              y1="0"
              x2="1"
              y2="0"
            >
              <stop
                offset="0%"
                stop-color="#58a6ff"
              />
              <stop
                offset="50%"
                stop-color="#79c0ff"
              />
              <stop
                offset="100%"
                stop-color="#a5d6ff"
              />
            </linearGradient>

            <filter
              id="softShadow"
              x="-20%"
              y="-20%"
              width="140%"
              height="140%"
            >
              <feDropShadow
                dx="0"
                dy="2"
                stdDeviation="4"
                flood-color="#000000"
                flood-opacity="0.25"
              />
            </filter>

          </defs>
          """)

          # ---------------------------------------------------------
          # Background
          # ---------------------------------------------------------

          svg.append(
              '<rect '
              'x="0" y="0" '
              'width="100%" '
              'height="100%" '
              'rx="18" '
              'fill="#0d1117" '
              'stroke="#21262d" '
              'stroke-width="1"/>'
          )

          # ---------------------------------------------------------
          # Header
          # ---------------------------------------------------------

          svg.append(
              '<text '
              'x="36" y="38" '
              'fill="#f0f6fc" '
              'font-family="Arial, sans-serif" '
              'font-size="20" '
              'font-weight="700">'
              'GitHub Activity'
              '</text>'
          )

          svg.append(
              '<text '
              'x="36" y="61" '
              'fill="#8b949e" '
              'font-family="Arial, sans-serif" '
              'font-size="12">'
              'Daily contributions · Last 365 days'
              '</text>'
          )

          # ---------------------------------------------------------
          # Header statistics
          # ---------------------------------------------------------

          stats = [
              ("Total Contributions", str(total)),
              ("Active Days", str(active_days)),
              ("Peak Day", str(peak))
          ]

          stat_x = [650, 835, 1020]

          for i, (label, value) in enumerate(stats):

              box_x = stat_x[i]

              svg.append(
                  f'<rect '
                  f'x="{box_x}" y="18" '
                  'width="155" height="55" '
                  'rx="10" '
                  'fill="#161b22" '
                  'stroke="#30363d" '
                  'stroke-width="1"/>'
              )

              svg.append(
                  f'<text '
                  f'x="{box_x + 12}" y="37" '
                  'fill="#8b949e" '
                  'font-family="Arial, sans-serif" '
                  'font-size="10">'
                  f'{escape(label)}'
                  '</text>'
              )

              svg.append(
                  f'<text '
                  f'x="{box_x + 12}" y="58" '
                  'fill="#f0f6fc" '
                  'font-family="Arial, sans-serif" '
                  'font-size="16" '
                  'font-weight="700">'
                  f'{escape(value)}'
                  '</text>'
              )

          # ---------------------------------------------------------
          # Chart background
          # ---------------------------------------------------------

          svg.append(
              f'<rect '
              f'x="{left}" '
              f'y="{top}" '
              f'width="{chart_width}" '
              f'height="{chart_height}" '
              f'rx="10" '
              f'fill="#0d1117"/>'
          )

          # ---------------------------------------------------------
          # Y-axis grid
          # ---------------------------------------------------------

          steps = 5

          for i in range(steps + 1):

              value = round(max_value * i / steps)
              yy = y(value)

              svg.append(
                  f'<line '
                  f'x1="{left}" '
                  f'y1="{yy:.2f}" '
                  f'x2="{width - right}" '
                  f'y2="{yy:.2f}" '
                  'stroke="#21262d" '
                  'stroke-width="1"/>'
              )

              svg.append(
                  f'<text '
                  f'x="{left - 14}" '
                  f'y="{yy + 4:.2f}" '
                  'text-anchor="end" '
                  'fill="#8b949e" '
                  'font-family="Arial, sans-serif" '
                  'font-size="11">'
                  f'{value}'
                  '</text>'
              )

          # ---------------------------------------------------------
          # Month labels + vertical guides
          # ---------------------------------------------------------

          last_month = None

          for i, date in enumerate(dates):

              month_key = date.strftime("%Y-%m")

              if month_key != last_month:

                  # Month guide
                  svg.append(
                      f'<line '
                      f'x1="{x(i):.2f}" '
                      f'y1="{top}" '
                      f'x2="{x(i):.2f}" '
                      f'y2="{top + chart_height}" '
                      'stroke="#21262d" '
                      'stroke-width="1" '
                      'stroke-dasharray="3 6" '
                      'opacity="0.65"/>'
                  )

                  # Month label
                  svg.append(
                      f'<text '
                      f'x="{x(i):.2f}" '
                      f'y="{height - 26}" '
                      'fill="#8b949e" '
                      'font-family="Arial, sans-serif" '
                      'font-size="11" '
                      'font-weight="600">'
                      f'{escape(date.strftime("%b"))}'
                      '</text>'
                  )

                  last_month = month_key

          # ---------------------------------------------------------
          # Area
          # ---------------------------------------------------------

          points = [
              f"{x(i):.2f},{y(value):.2f}"
              for i, value in enumerate(values)
          ]

          area_points = (
              f"{left},{top + chart_height} "
              + " ".join(points)
              + f" {width - right},{top + chart_height}"
          )

          svg.append(
              f'<polygon '
              f'points="{area_points}" '
              'fill="url(#areaGradient)"/>'
          )

          # ---------------------------------------------------------
          # Main line
          # ---------------------------------------------------------

          svg.append(
              f'<polyline '
              f'points="{" ".join(points)}" '
              'fill="none" '
              'stroke="url(#lineGradient)" '
              'stroke-width="2.5" '
              'stroke-linejoin="round" '
              'stroke-linecap="round"/>'
          )

          # ---------------------------------------------------------
          # Activity points
          #
          # Instead of rendering 365 points:
          # - inactive days have no point
          # - active days have small points
          # - only peak gets a larger highlight
          # ---------------------------------------------------------

          for i, value in enumerate(values):

              if value <= 0:
                  continue

              date = dates[i]

              # Peak point
              if value == peak and peak > 0:

                  svg.append(
                      f'<circle '
                      f'cx="{x(i):.2f}" '
                      f'cy="{y(value):.2f}" '
                      'r="6" '
                      'fill="#58a6ff" '
                      'stroke="#f0f6fc" '
                      'stroke-width="2" '
                      'filter="url(#softShadow)">'
                      f'<title>'
                      f'{escape(date.strftime("%B %d, %Y"))}'
                      f' — {value} contributions'
                      f'</title>'
                      '</circle>'
                  )

              else:

                  # Normal active day
                  svg.append(
                      f'<circle '
                      f'cx="{x(i):.2f}" '
                      f'cy="{y(value):.2f}" '
                      'r="3" '
                      'fill="#58a6ff" '
                      'opacity="0.9">'
                      f'<title>'
                      f'{escape(date.strftime("%B %d, %Y"))}'
                      f' — {value} contributions'
                      f'</title>'
                      '</circle>'
                  )

          # ---------------------------------------------------------
          # Peak annotation
          # ---------------------------------------------------------

          if peak > 0:

              px = x(peak_index)
              py = y(peak)

              label_x = min(
                  max(px - 55, left),
                  width - right - 110
              )

              label_y = max(py - 38, top + 18)

              svg.append(
                  f'<line '
                  f'x1="{px:.2f}" '
                  f'y1="{py:.2f}" '
                  f'x2="{px:.2f}" '
                  f'y2="{label_y + 8:.2f}" '
                  'stroke="#58a6ff" '
                  'stroke-width="1" '
                  'stroke-dasharray="3 3"/>'
              )

              svg.append(
                  f'<rect '
                  f'x="{label_x:.2f}" '
                  f'y="{label_y - 16:.2f}" '
                  'width="110" '
                  'height="24" '
                  'rx="6" '
                  'fill="#161b22" '
                  'stroke="#30363d"/>'
              )

              svg.append(
                  f'<text '
                  f'x="{label_x + 55:.2f}" '
                  f'y="{label_y:.2f}" '
                  'text-anchor="middle" '
                  'fill="#f0f6fc" '
                  'font-family="Arial, sans-serif" '
                  'font-size="10" '
                  'font-weight="600">'
                  f'Peak · {peak}'
                  '</text>'
              )

          # ---------------------------------------------------------
          # Today marker
          # ---------------------------------------------------------

          today_x = x(len(values) - 1)

          svg.append(
              f'<line '
              f'x1="{today_x:.2f}" '
              f'y1="{top}" '
              f'x2="{today_x:.2f}" '
              f'y2="{top + chart_height}" '
              'stroke="#58a6ff" '
              'stroke-width="1" '
              'stroke-dasharray="4 5" '
              'opacity="0.45"/>'
          )

          svg.append(
              f'<text '
              f'x="{today_x:.2f}" '
              f'y="{top - 8}" '
              'text-anchor="end" '
              'fill="#58a6ff" '
              'font-family="Arial, sans-serif" '
              'font-size="10">'
              'Today'
              '</text>'
          )

          # ---------------------------------------------------------
          # Footer
          # ---------------------------------------------------------

          svg.append(
              f'<text '
              f'x="{width - right}" '
              f'y="{height - 26}" '
              'text-anchor="end" '
              'fill="#6e7681" '
              'font-family="Arial, sans-serif" '
              'font-size="10">'
              f'Peak: {peak} on {escape(peak_date.strftime("%b %d, %Y"))}'
              '</text>'
          )

          # Accessibility description
          svg.append(
              '<desc>'
              f'{escape(username)} GitHub activity graph. '
              f'{total} total contributions over the last 365 days. '
              f'Peak day had {peak} contributions.'
              '</desc>'
          )

          svg.append("</svg>")

          # ---------------------------------------------------------
          # Write SVG
          # ---------------------------------------------------------

          with open(
              "assets/activity-graph.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write("\n".join(svg))

          print(
              f"Generated graph: "
              f"{total} contributions, "
              f"{active_days} active days, "
              f"peak {peak}"
          )
          PY

          python /tmp/generate_graph.py

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/activity-graph.svg

          if git diff --cached --quiet; then
            echo "No graph changes."
          else
            git commit -m "Update activity graph"
            git push
          fi
